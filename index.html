<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Task Allocation Tracker - Suggestion & Manual Combo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-200 text-slate-800 p-3 md:p-6 font-sans antialiased min-h-screen pb-12">

  <div class="max-w-7xl mx-auto space-y-4 md:space-y-6">
    
    <!-- Top Header & Action Controls -->
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-300 gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
          ⚡ Task Allocation Tracker
        </h1>
        <p class="text-xs md:text-sm text-slate-500 mt-0.5">Veda Solutions • Omni Trade Networks</p>
      </div>
      
      <!-- Actions Toolbar -->
      <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
        
        <!-- Location Dropdown from Google Sheets -->
        <select id="locationDropdown" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs md:text-sm font-bold rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="">⏳ Loading Locations...</option>
        </select>

        <!-- Save to Google Sheets Button -->
        <button id="saveBtn" onclick="saveToGoogleSheets()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1 shadow-sm">
          💾 Save to Cloud
        </button>

        <!-- Local Excel Export Button -->
        <button onclick="exportToExcel()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-bold transition flex items-center gap-1 shadow-sm">
          📥 Export Excel
        </button>

        <!-- Edit Toggle -->
        <button id="editToggleBtn" onclick="toggleEditMode()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2.5 rounded-xl text-xs md:text-sm font-bold transition shadow-sm">
          ✏️ Edit
        </button>

        <!-- Clear Button -->
        <button onclick="requestClearAll()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-2.5 rounded-xl text-xs md:text-sm font-bold transition">
          🗑️ Clear
        </button>

      </div>
    </div>

    <!-- Inputs Control -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-300 flex gap-2">
        <input type="text" id="taskInput" placeholder="Add new task name..." class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
        <button onclick="addTaskColumn()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold transition whitespace-nowrap shadow-sm">
          + Add Task
        </button>
      </div>

      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-300 flex gap-2">
        <input type="text" id="userInput" placeholder="Add new user name..." class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
        <button onclick="addUserRow()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold transition whitespace-nowrap shadow-sm">
          + Add User
        </button>
      </div>
    </div>

    <!-- Tasks Pool Overview Section -->
    <div class="bg-white p-4 rounded-2xl border border-slate-300 shadow-sm space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
          📦 Tasks Pool (<span id="taskCountHeader">0</span>)
        </span>
        <span class="text-[11px] text-slate-400 font-medium">Click task to toggle Hold/Unhold status</span>
      </div>
      <div id="tasksPoolContainer" class="flex flex-wrap gap-2 pt-1"></div>
    </div>

    <!-- Dynamic Main Cards Grid Container -->
    <div id="mainContainer" class="space-y-4"></div>

  </div>

  <!-- History Modal Popup -->
  <div id="historyModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
            📜 Task History for <span id="historyUserName" class="text-indigo-600">User</span>
          </h3>
          <p class="text-xs text-slate-500" id="historySummaryText">Completed 0 tasks</p>
        </div>
        <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold p-1">✕</button>
      </div>
      <div id="historyListContainer" class="max-h-80 overflow-y-auto space-y-2 pr-1"></div>
      <div class="flex justify-end pt-2 border-t border-slate-100">
        <button onclick="closeHistoryModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Universal Notification Modal -->
  <div id="customModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-sm w-full p-5 space-y-4">
      <div class="flex items-start gap-3">
        <div id="modalIcon" class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg font-bold shrink-0">💡</div>
        <div class="space-y-1">
          <h3 id="modalTitle" class="text-base font-bold text-slate-900">Notification</h3>
          <p id="modalMessage" class="text-xs text-slate-600 leading-relaxed">Modal message content.</p>
        </div>
      </div>
      <div id="modalInputContainer" class="hidden">
        <input type="text" id="modalInput" class="w-full px-3.5 py-2 border rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50" placeholder="Type here...">
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
        <button id="modalCancelBtn" onclick="closeCustomModal(false)" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition hidden">Cancel</button>
        <button id="modalConfirmBtn" onclick="closeCustomModal(true)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition shadow-sm">OK</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE THIS STRING WITH YOUR GOOGLE APPS SCRIPT WEB APP DEPLOYMENT URL:
    const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const TASK_DURATION_MINUTES = 30;
    let isEditMode = false;

    let state = JSON.parse(localStorage.getItem('task_allocator_v15')) || {
      tasks: [],
      heldTasks: [],
      users: []
    };

    if (!state.heldTasks) state.heldTasks = [];

    let modalResolver = null;

    function showModal({ title, message, type = 'alert', defaultValue = '', icon = '💡', confirmText = 'OK', cancelText = 'Cancel' }) {
      return new Promise((resolve) => {
        modalResolver = resolve;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('modalIcon').innerText = icon;

        const inputContainer = document.getElementById('modalInputContainer');
        const inputEl = document.getElementById('modalInput');
        const cancelBtn = document.getElementById('modalCancelBtn');
        const confirmBtn = document.getElementById('modalConfirmBtn');

        confirmBtn.innerText = confirmText;
        cancelBtn.innerText = cancelText;

        if (type === 'prompt') {
          inputContainer.classList.remove('hidden');
          inputEl.value = defaultValue;
          setTimeout(() => inputEl.focus(), 100);
        } else {
          inputContainer.classList.add('hidden');
        }

        if (type === 'confirm' || type === 'prompt') {
          cancelBtn.classList.remove('hidden');
        } else {
          cancelBtn.classList.add('hidden');
        }

        document.getElementById('customModal').classList.remove('hidden');
      });
    }

    function closeCustomModal(isConfirmed) {
      const modal = document.getElementById('customModal');
      const inputEl = document.getElementById('modalInput');
      const val = inputEl.value;
      modal.classList.add('hidden');

      if (modalResolver) {
        if (inputEl.parentElement.classList.contains('hidden')) {
          modalResolver(isConfirmed);
        } else {
          modalResolver(isConfirmed ? val : null);
        }
        modalResolver = null;
      }
    }

    async function fetchSheetLocations() {
      const dropdown = document.getElementById('locationDropdown');
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) {
        dropdown.innerHTML = `<option value="">⚠️ Set AppScript URL</option>`;
        return;
      }

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const data = await response.json();

        if (data.locations && data.locations.length > 0) {
          dropdown.innerHTML = `<option value="">-- Select Location --</option>` + 
            data.locations.map(loc => `<option value="${loc}">${loc}</option>`).join('');
        } else {
          dropdown.innerHTML = `<option value="">No Location Sheets Found</option>`;
        }
      } catch (err) {
        dropdown.innerHTML = `<option value="">Error Connecting Sheets</option>`;
      }
    }

    async function saveToGoogleSheets() {
      const location = document.getElementById('locationDropdown').value;
      if (!location) {
        await showModal({ title: 'Select Location', message: 'Please select a location from the dropdown first!', icon: '⚠️' });
        return;
      }

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "⏳ Saving...";
      saveBtn.disabled = true;

      try {
        const payload = { location: location, users: state.users };

        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        await showModal({
          title: 'Successfully Saved!',
          message: `Task tracking snapshot updated in Google Sheet under location tab "${location}".`,
          icon: '✅'
        });

      } catch (err) {
        await showModal({ title: 'Save Failed', message: 'Failed to communicate with Google Sheets.', icon: '❌' });
      } finally {
        saveBtn.innerText = "💾 Save to Cloud";
        saveBtn.disabled = false;
      }
    }

    function exportToExcel() {
      if (state.users.length === 0) {
        showModal({ title: 'No Data', message: 'No users or data available to export!', icon: '⚠️' });
        return;
      }

      const exportData = state.users.map((u, idx) => {
        const totalTasks = u.history.length;
        const totalMinutes = u.history.reduce((sum, item) => sum + item.durationMinutes, 0);
        const historySeq = u.history.map((h, i) => `${i + 1}. ${h.taskName} (${h.durationMinutes}m)`).join(' -> ');

        return {
          "S.No": idx + 1,
          "User Name": u.name,
          "Active Task Status": u.activeTask ? u.activeTask.displayName : 'Free / Idle',
          "Completed Tasks": totalTasks,
          "Total Minutes": totalMinutes,
          "Completed Tasks History": historySeq || 'No History'
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      worksheet['!cols'] = [{ wch: 8 }, { wch: 20 }, { wch: 25 }, { wch: 18 }, { wch: 15 }, { wch: 50 }];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Task Summary");
      XLSX.writeFile(workbook, `Task_Allocation_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function saveData() {
      localStorage.setItem('task_allocator_v15', JSON.stringify(state));
      renderView();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('editToggleBtn');
      btn.innerText = isEditMode ? '✅ Exit' : '✏️ Edit';
      renderView();
    }

    async function addTaskColumn() {
      const input = document.getElementById('taskInput');
      const val = input.value.trim();
      if (!val) return;
      if (state.tasks.includes(val)) {
        await showModal({ title: 'Duplicate Task', message: `"${val}" already exists!`, icon: '⚠️' });
        return;
      }
      state.tasks.push(val);
      input.value = '';
      saveData();
    }

    async function addUserRow() {
      const input = document.getElementById('userInput');
      const val = input.value.trim();
      if (!val) return;
      state.users.push({ id: Date.now().toString(), name: val, activeTask: null, history: [] });
      input.value = '';
      saveData();
    }

    function toggleTaskPoolHold(taskName) {
      if (state.heldTasks.includes(taskName)) {
        state.heldTasks = state.heldTasks.filter(t => t !== taskName);
      } else {
        state.heldTasks.push(taskName);
      }
      saveData();
    }

    async function handleTaskClick(taskName) {
      if (!isEditMode) {
        toggleTaskPoolHold(taskName);
        return;
      }
      const res = await showModal({ title: `Edit Task: "${taskName}"`, message: `Type new name or leave empty to delete:`, type: 'prompt', defaultValue: taskName, icon: '✏️' });
      if (res === null) return;
      const trimmed = res.trim();
      if (trimmed === '') {
        state.tasks = state.tasks.filter(t => t !== taskName);
        state.heldTasks = state.heldTasks.filter(t => t !== taskName);
      } else {
        const idx = state.tasks.indexOf(taskName);
        if (idx !== -1) state.tasks[idx] = trimmed;
      }
      saveData();
    }

    async function handleUserClick(userId) {
      if (!isEditMode) return;
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      const res = await showModal({ title: `Edit User: "${user.name}"`, message: `Type new name or leave empty to delete:`, type: 'prompt', defaultValue: user.name, icon: '👤' });
      if (res === null) return;
      const trimmed = res.trim();
      if (trimmed === '') {
        state.users = state.users.filter(u => u.id !== userId);
      } else {
        user.name = trimmed;
      }
      saveData();
    }

    function getTaskCompletionCount(user, taskBaseName) {
      return user.history.filter(h => h.baseName === taskBaseName).length;
    }

    // Logic to calculate smart suggested task for a user
    function getSuggestedTask(user) {
      const availableTasks = state.tasks.filter(t => {
        const isHeld = state.heldTasks.includes(t);
        const isBusy = state.users.some(u => u.id !== user.id && u.activeTask?.baseName === t);
        return !isHeld && !isBusy;
      });

      if (availableTasks.length === 0) return null;

      // Pick task done least amount of times by this user
      availableTasks.sort((a, b) => getTaskCompletionCount(user, a) - getTaskCompletionCount(user, b));
      return availableTasks[0];
    }

    async function assignTask(userId, taskBaseName) {
      if (!taskBaseName) return;
      if (isEditMode) {
        await showModal({ title: 'Edit Mode Active', message: "Exit Edit Mode first.", icon: '⚠️' });
        return;
      }

      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      if (user.activeTask) {
        const confirmSwitch = await showModal({
          title: 'Switch Task?',
          message: `"${user.name}" is working on "${user.activeTask.displayName}". Replace with "${taskBaseName}"?`,
          type: 'confirm',
          icon: '⚠️'
        });
        if (!confirmSwitch) return;
      }

      if (state.heldTasks.includes(taskBaseName)) {
        const confirmHold = await showModal({
          title: 'Task On Hold',
          message: `"${taskBaseName}" is ON HOLD in pool. Assign anyway?`,
          type: 'confirm',
          icon: '⏸️'
        });
        if (!confirmHold) return;
      }

      const busyUser = state.users.find(u => u.id !== userId && u.activeTask?.baseName === taskBaseName);
      if (busyUser) {
        const confirmBusy = await showModal({
          title: 'Task Busy',
          message: `"${taskBaseName}" is currently active with ${busyUser.name}. Assign anyway?`,
          type: 'confirm',
          icon: '⚠️'
        });
        if (!confirmBusy) return;
      }

      const completedCount = getTaskCompletionCount(user, taskBaseName);
      let displayName = taskBaseName;

      if (completedCount > 0) {
        displayName = `${taskBaseName} (${completedCount + 1}x)`;
      }

      const now = Date.now();
      user.activeTask = {
        baseName: taskBaseName,
        displayName: displayName,
        assignedAt: now,
        expiresAt: now + (TASK_DURATION_MINUTES * 60 * 1000)
      };

      saveData();
    }

    function completeTask(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user || !user.activeTask) return;

      const elapsedMs = Date.now() - user.activeTask.assignedAt;
      const durationMinutes = Math.min(TASK_DURATION_MINUTES, Math.max(1, Math.round(elapsedMs / 60000)));

      user.history.push({
        baseName: user.activeTask.baseName,
        taskName: user.activeTask.displayName,
        durationMinutes: durationMinutes,
        completedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      user.activeTask = null;
      saveData();
    }

    function getFormattedTimeRemaining(expiresAt) {
      const diff = Math.max(0, expiresAt - Date.now());
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function openHistoryModal(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      document.getElementById('historyUserName').innerText = user.name;
      const totalMins = user.history.reduce((sum, h) => sum + h.durationMinutes, 0);
      document.getElementById('historySummaryText').innerText = `Completed ${user.history.length} tasks • ${totalMins} mins logged`;

      const listContainer = document.getElementById('historyListContainer');
      listContainer.innerHTML = user.history.length === 0 ? `<div class="p-6 text-center text-slate-400 italic text-xs">No history yet.</div>` :
        user.history.map((h, i) => `
          <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl flex items-center justify-between">
            <span class="font-bold text-xs text-slate-900">${i + 1}. ${h.taskName} (${h.completedAt})</span>
            <span class="px-2.5 py-1 bg-amber-100 text-amber-900 text-[10px] font-extrabold rounded-lg">⏱️ ${h.durationMinutes}m</span>
          </div>
        `).join('');

      document.getElementById('historyModal').classList.remove('hidden');
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function renderView() {
      renderTasksPoolHeader();
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
          ${state.users.map((u) => {
            const isAssigned = !!u.activeTask;
            const totalMins = u.history.reduce((sum, item) => sum + item.durationMinutes, 0);
            const suggestedTask = getSuggestedTask(u);

            return `
              <div class="rounded-2xl border ${isAssigned ? 'bg-slate-100 border-indigo-300 shadow-md' : 'bg-white border-slate-200 shadow-sm'} p-3.5 flex flex-col justify-between space-y-3">
                <div>
                  <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${isAssigned ? 'bg-indigo-600 text-white' : 'bg-emerald-100 text-emerald-800'}">
                      ${isAssigned ? '⚡ BUSY' : '🟢 FREE'}
                    </span>
                    <button onclick="openHistoryModal('${u.id}')" class="text-indigo-600 font-bold underline text-[10px]">History (${u.history.length})</button>
                  </div>
                  <div onclick="handleUserClick('${u.id}')" class="font-black text-slate-900 text-base truncate">${u.name}</div>
                  <div class="text-[11px] text-slate-500 font-medium mt-0.5">${totalMins} total mins</div>
                </div>

                <!-- Active Task Info Box -->
                <div class="bg-white/80 rounded-xl p-2.5 border border-slate-200 space-y-1">
                  <div class="text-[9px] font-bold text-slate-400 uppercase">Active Task</div>
                  ${isAssigned ? `
                    <div class="px-2.5 py-1 bg-indigo-600 text-white font-bold text-xs rounded-lg break-words">${u.activeTask.displayName}</div>
                    <div class="text-xs font-mono font-bold text-amber-800 mt-2 flex justify-between items-center">
                      <span>⏱️ <span id="timer-${u.id}">--:--</span></span>
                      <button onclick="completeTask('${u.id}')" class="text-[10px] bg-emerald-600 text-white px-2 py-1 rounded-md font-bold hover:bg-emerald-700">Done</button>
                    </div>
                  ` : `<span class="text-emerald-600 font-bold text-xs block py-1">🟢 Ready for task</span>`}
                </div>

                <!-- Auto-Suggested Task Section -->
                <div class="bg-amber-50/80 rounded-xl p-2.5 border border-amber-200/80 space-y-1">
                  <div class="text-[9px] font-bold text-amber-700 uppercase tracking-wider">💡 Suggested Task</div>
                  ${suggestedTask ? `
                    <div class="flex items-center justify-between gap-1">
                      <span class="text-xs font-bold text-slate-800 truncate">${suggestedTask} (${getTaskCompletionCount(u, suggestedTask)}x)</span>
                      <button onclick="assignTask('${u.id}', '${suggestedTask}')" class="bg-amber-600 hover:bg-amber-700 text-white text-[10px] font-bold px-2 py-1 rounded-md transition shrink-0">
                        Assign
                      </button>
                    </div>
                  ` : `<span class="text-[11px] text-slate-400 italic">No task available</span>`}
                </div>

                <!-- Manual Allocation Dropdown Section -->
                <div class="bg-indigo-50/80 rounded-xl p-2.5 border border-indigo-100 space-y-1.5">
                  <div class="text-[9px] font-bold text-indigo-600 uppercase tracking-wider">🎯 Manual Selection</div>
                  <select onchange="assignTask('${u.id}', this.value); this.value='';" class="w-full text-xs font-bold bg-white border border-indigo-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none shadow-2xs">
                    <option value="">-- Choose Task --</option>
                    ${state.tasks.map(t => {
                      const doneCount = getTaskCompletionCount(u, t);
                      const busyUser = state.users.find(other => other.id !== u.id && other.activeTask?.baseName === t);
                      const isHeld = state.heldTasks.includes(t);

                      let label = `${t} (Done ${doneCount}x)`;
                      if (isHeld) label += ' [HELD]';
                      if (busyUser) label += ` [Busy: ${busyUser.name}]`;

                      return `<option value="${t}">${label}</option>`;
                    }).join('')}
                  </select>
                </div>

              </div>
            `;
          }).join('')}
        </div>
      `;
      renderTimersOnly();
    }

    function renderTasksPoolHeader() {
      const poolEl = document.getElementById('tasksPoolContainer');
      document.getElementById('taskCountHeader').innerText = state.tasks.length;
      poolEl.innerHTML = state.tasks.map((t, idx) => `
        <button onclick="handleTaskClick('${t}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border ${state.heldTasks.includes(t) ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-slate-100 text-slate-700 border-slate-200'}">
          ${idx + 1}. ${t} ${state.heldTasks.includes(t) ? '(HELD)' : ''}
        </button>
      `).join('');
    }

    function renderTimersOnly() {
      state.users.forEach(u => {
        if (u.activeTask) {
          const timerEl = document.getElementById(`timer-${u.id}`);
          if (timerEl) timerEl.innerText = getFormattedTimeRemaining(u.activeTask.expiresAt);
        }
      });
    }

    async function requestClearAll() {
      const confirmClear = await showModal({ title: 'Clear Data', message: 'Clear all tasks, users, and history?', type: 'confirm', icon: '🗑️' });
      if (confirmClear) {
        localStorage.removeItem('task_allocator_v15');
        state = { tasks: [], heldTasks: [], users: [] };
        renderView();
      }
    }

    setInterval(renderTimersOnly, 1000);
    fetchSheetLocations();
    renderView();
  </script>
</body>
</html>
